apiVersion: v1
kind: Namespace
metadata:
  name: b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx1
  namespace: b
  labels:
    app: nginx1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx1
  template:
    metadata:
      labels:
        app: nginx1
    spec:
      containers:
      - name: nginx
        image: nginx2:1.14.2
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-config
  namespace: b
data:
  env: prod
